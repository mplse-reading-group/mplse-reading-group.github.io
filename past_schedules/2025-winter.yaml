  - Russell Rozenbaum
  - April 4th, 4-5pm in 4901 BBB
  - Structure-Level Interactions in LLM-Based Coding Agents
  - ""
  - >
    This work explores the development of structure-based action languages for LLM-powered
    coding agents, moving beyond traditional line-based approaches. We hypothesize that
    line-based interactions undermine the semantical abstractions naturally used when
    coding. Our research integrates LLM agents with Hazel, a live functional programming
    environment capable of structure-level editing and semantic analysis even in incomplete
    programs. By equipping agents with higher-level, structure-based actions, we aim to
    enhance their code generation capabilities. Additionally, we develop an interactive
    user interface for human-agent collaboration. This research contributes to both
    automated program synthesis and programming education, while addressing the semantic
    contextualization challenges faced by existing LLM-based coding assistants.
